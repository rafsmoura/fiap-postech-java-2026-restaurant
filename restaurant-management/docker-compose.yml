services:
  db:
    image: mysql:8.0
    container_name: restaurant-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-restaurant_db}
      MYSQL_USER: ${DB_USER:-restaurant}
      MYSQL_PASSWORD: ${DB_PASSWORD:-restaurant}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    build: .
    container_name: restaurant-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-restaurant_db}
      DB_USER: ${DB_USER:-restaurant}
      DB_PASSWORD: ${DB_PASSWORD:-restaurant}
      SERVER_PORT: 8080
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  mysql_data:
